# Local token rows, including CUDA Graph padding; K8 typically has 9 rows/request.
quantization: fp8_per_block
compilation-config:
  cudagraph_mode: FULL_DECODE_ONLY
additional-config:
  yoco_execution_mode: fast
  yoco_mega_moe: fp8_group32
  yoco_moe_dispatch:
    mode: manual
    triton_max_tokens: 16
    mega_min_tokens: 17
    mega_prefill: false
